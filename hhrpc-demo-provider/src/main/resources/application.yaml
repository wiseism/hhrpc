server:
  port: 8081

hhrpc:
  zk:
    servers: localhost:2181
    root: hhrpc
  app:
    id: hhrpc
    namespace: public
    env: dev
  provider:
    metas:
      gray: false
      bc: bj
      union: B001
      tc: 25
      limitWindow: 30

app:
  id: app01
apollo:
  cluster: default
  cache-dir: /Users/lifei/Documents/workspace/hhprojects/apollo-quick-start/cachedata
  meta: http://localhost:8080
  autoUpdateInjectedSpringProperties: true
  bootstrap:
    enabled: false
    namespaces: provider,application
    eagerLoad:
      enabled: true

hhregister:
  servers: http://localhost:8383
logging:
  level:
    root: info
    io.gitee.hefren: debug
    com.hhrpc.hhrpc: debug
    com.hhrpc.hhrpc.core.register: info