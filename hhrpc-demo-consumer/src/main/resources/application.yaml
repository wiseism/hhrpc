spring:
  application:
  name: hhrpc-demo-consumer
server:
  port: 8088

hhrpc:
  providers: http://localhost:8081,http://localhost:8082,http://localhost:8083
  zk:
    servers: localhost:2181
    root: hhrpc
  app:
    id: hhrpc
    namespace: public
    env: dev
  consumer:
    retries: 2
    # 灰度流量占比（0-100）
    grayRatio: 10
    faultLimit: 10
    halfOpenInitDelay: 10_000
    halfOpenDelay: 60_000
    timeout: 1_000



logging:
  level:
    root: error
    com.hhrpc.hhrpc: debug

app:
  id: app01
apollo:
  cluster: default
  cache-dir: /Users/lifei/Documents/workspace/hhprojects/apollo-quick-start/cachedata
  meta: http://localhost:8080
  autoUpdateInjectedSpringProperties: true
  bootstrap:
    enabled: true
    namespaces: consumer,application
    eagerLoad:
      enabled: true